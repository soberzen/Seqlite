services:
  seqlite-postgres:
    image: postgres:18
    ports:
      - '${POSTGRES_PORT}:5432'
    environment:
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_NAME}'
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_timezone=Asia/Shanghai
    volumes:
      - seqlite-postgres-data:/var/lib/postgresql
    networks:
      - seqlite-network
  seqlite-redis:
    image: redis:8
    ports:
      - '${REDIS_PORT}:6379'
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - '${REDIS_PASSWORD}'
    volumes:
      - seqlite-redis-data:/data
    networks:
      - seqlite-network

networks:
  seqlite-network:
    driver: bridge

volumes:
  seqlite-postgres-data:
  seqlite-redis-data:
